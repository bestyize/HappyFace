name: Package previews

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test expression engine and package web preview
        run: bash ./gradlew :shared:desktopTest :webApp:wasmJsBrowserDistribution --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HappyFace-web
          path: webApp/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            gradle: ./gradlew.bat
            task: packageMsi
            extension: msi
          - platform: macos-arm64
            os: macos-15
            gradle: bash ./gradlew
            task: packageDmg
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add WiX to PATH for MSI packaging
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
      - name: Package desktop preview
        run: ${{ matrix.gradle }} :desktopApp:${{ matrix.task }} --no-daemon
      - name: Show macOS jpackage diagnostics
        if: failure() && matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          if [ -d desktopApp/build/compose/logs ]; then
            find desktopApp/build/compose/logs -type f \( -name '*-err.txt' -o -name '*-out.txt' \) -print -exec cat {} \;
          fi
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.platform == 'macos-arm64'
        with:
          name: HappyFace-macos-jpackage-logs
          path: desktopApp/build/compose/logs/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: HappyFace-${{ matrix.platform }}
          path: desktopApp/build/compose/binaries/main/**/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14
